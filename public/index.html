<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIM DOLCE - WhatsApp</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            color: #111827;
            border-radius: 24px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg,#25D366,#128C7E);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #25D366;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #25D366;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        #qrBox {
            display: none;
            margin-top: 25px;
        }

        #qrBox img {
            width: 300px;
            max-width: 100%;
            border-radius: 12px;
            border: 8px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
        }

        .instructions {
            margin-top: 15px;
            color: #4b5563;
            line-height: 1.5;
            font-size: 14px;
        }

        .loading {
            display: none;
            margin-top: 15px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #ddd;
            border-top-color: #25D366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">KD</div>

    <h1>KIM DOLCE</h1>

    <div class="subtitle">
        Connectez votre WhatsApp à votre bot
    </div>

    <label for="phone">
        Numéro WhatsApp
    </label>

    <input
        id="phone"
        type="tel"
        placeholder="509XXXXXXXX"
        autocomplete="tel"
    >

    <button id="connectBtn">
        📱 Générer QR WhatsApp
    </button>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Connexion à WhatsApp...</p>
    </div>

    <div id="message"></div>

    <div id="qrBox">

        <h3>📱 Scanne ce QR avec WhatsApp</h3>

        <img id="qrImage" src="" alt="QR WhatsApp">

        <div class="instructions">
            WhatsApp → Appareils connectés
            → Connecter un appareil
            → Scanne le QR ci-dessus.
        </div>

    </div>

</div>

<script>

const phoneInput =
    document.getElementById("phone");

const connectBtn =
    document.getElementById("connectBtn");

const message =
    document.getElementById("message");

const qrBox =
    document.getElementById("qrBox");

const qrImage =
    document.getElementById("qrImage");

const loading =
    document.getElementById("loading");


function showMessage(text, type) {

    message.textContent = text;

    message.className = "";

    message.classList.add(type);
}


function hideMessage() {

    message.style.display = "none";

    message.className = "";
}


connectBtn.addEventListener(
    "click",
    async function () {

        const phone =
            phoneInput.value
                .replace(/\D/g, "");

        if (!phone) {

            showMessage(
                "❌ Entre ton numéro WhatsApp.",
                "error"
            );

            return;
        }

        if (
            phone.length < 8 ||
            phone.length > 15
        ) {

            showMessage(
                "❌ Numéro WhatsApp invalide.",
                "error"
            );

            return;
        }


        qrBox.style.display = "none";

        hideMessage();

        loading.style.display = "block";

        connectBtn.disabled = true;


        try {

            console.log(
                "📱 Envoi numéro:",
                phone
            );


            const response =
                await fetch(
                    "/api/connect",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            phone: phone
                        })
                    }
                );


            console.log(
                "HTTP:",
                response.status
            );


            const data =
                await response.json();


            console.log(
                "Réponse:",
                data
            );


            loading.style.display = "none";


            if (!data.success) {

                showMessage(
                    "❌ " +
                    (
                        data.message ||
                        "Impossible de générer le QR."
                    ),
                    "error"
                );

                connectBtn.disabled = false;

                return;
            }


            if (data.connected) {

                showMessage(
                    "✅ WhatsApp est déjà connecté !",
                    "success"
                );

                connectBtn.disabled = false;

                return;
            }


            if (data.qr) {

                qrImage.src =
                    data.qr;

                qrBox.style.display =
                    "block";

                showMessage(
                    "✅ QR WhatsApp généré !",
                    "success"
                );

                connectBtn.disabled = false;

                return;
            }


            showMessage(
                "⏳ QR non reçu. Réessaie dans quelques secondes.",
                "error"
            );

            connectBtn.disabled = false;


        } catch (error) {

            console.error(
                "Erreur:",
                error
            );

            loading.style.display = "none";

            showMessage(
                "❌ Erreur de connexion au serveur.",
                "error"
            );

            connectBtn.disabled = false;
        }

    }
);

</script>

</body>
</html>
