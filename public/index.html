<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KIM DOLCE - WhatsApp Bot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e1b4b);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    /* LOGO */
    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      font-weight: 900;
      color: white;
      border: 4px solid rgba(255,255,255,0.25);
      box-shadow:
        0 0 30px rgba(124,58,237,0.7),
        inset 0 0 20px rgba(255,255,255,0.15);
    }

    .title {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #d1d5db;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      font-size: 14px;
      color: #e5e7eb;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.15);
      outline: none;
      background: rgba(0,0,0,0.25);
      color: white;
      font-size: 16px;
      margin-bottom: 15px;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      color: #d1d5db;
    }

    /* QR */
    #qrBox {
      display: none;
      margin-top: 25px;
      background: white;
      padding: 15px;
      border-radius: 18px;
    }

    #qrImage {
      width: 100%;
      max-width: 300px;
      display: block;
      margin: auto;
    }

    .qrTitle {
      color: #111827;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO KIM DOLCE -->
    <div class="logo">
      KD
    </div>

    <div class="title">
      KIM DOLCE
    </div>

    <div class="subtitle">
      Connectez votre WhatsApp à votre bot
    </div>

    <label class="label">
      Numéro WhatsApp
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="509XXXXXXXX"
      autocomplete="tel"
    >

    <button id="connectBtn">
      📱 Générer QR WhatsApp
    </button>

    <div id="message">
      Entrez votre numéro WhatsApp pour commencer.
    </div>

    <!-- QR -->
    <div id="qrBox">

      <div class="qrTitle">
        📱 Scanne ce QR avec WhatsApp
      </div>

      <img
        id="qrImage"
        alt="QR WhatsApp"
      >

    </div>

    <div class="footer">
      🤖 KIM DOLCE WhatsApp Bot
    </div>

  </div>

<script>

const button =
  document.getElementById("connectBtn");

const phoneInput =
  document.getElementById("phone");

const message =
  document.getElementById("message");

const qrBox =
  document.getElementById("qrBox");

const qrImage =
  document.getElementById("qrImage");


button.addEventListener(
  "click",
  async () => {

    const phone =
      phoneInput.value.trim();

    if (!phone) {

      message.textContent =
        "❌ Entre ton numéro WhatsApp.";

      return;
    }

    button.disabled = true;

    button.textContent =
      "⏳ Génération du QR...";

    message.textContent =
      "Connexion au serveur...";

    qrBox.style.display = "none";

    try {

      const response =
        await fetch(
          "/api/connect",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              phone: phone
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.message ||
          "Erreur serveur."
        );
      }

      if (data.connected) {

        message.textContent =
          "✅ WhatsApp est déjà connecté.";

        return;
      }

      if (data.qr) {

        qrImage.src =
          data.qr;

        qrBox.style.display =
          "block";

        message.textContent =
          "✅ QR généré ! Ouvre WhatsApp → Appareils connectés → Connecter un appareil.";

        button.textContent =
          "🔄 Générer un nouveau QR";

      } else {

        message.textContent =
          "❌ Aucun QR reçu. Réessaie.";

      }

    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ " + error.message;

    } finally {

      button.disabled = false;

      if (
        button.textContent.includes(
          "Génération"
        )
      ) {

        button.textContent =
          "📱 Générer QR WhatsApp";
      }
    }
  }
);

</script>

</body>
        </html>
